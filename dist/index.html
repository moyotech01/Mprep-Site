<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchtower Comments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Watchtower Comments</h1>
      <p>Prepared notes for the Congregation Bible Study</p>
    </header>

    <div id="articles-list"></div>
    <div id="article-detail" class="hidden"></div>
  </div>

  <script src="app.js"></script>
  <script>
    let data = { articles: [] };

    async function init() {
      data = await loadComments();
      renderList();
    }

    function renderList() {
      const list = document.getElementById('articles-list');
      const detail = document.getElementById('article-detail');
      list.classList.remove('hidden');
      detail.classList.add('hidden');

      if (!data.articles.length) {
        list.innerHTML = `<div class="empty-state">No articles yet.</div>`;
        return;
      }

      list.innerHTML = data.articles.map(article => `
        <div class="article-card" onclick="showArticle('${article.id}')">
          <h2>${article.title}</h2>
          <div class="article-meta">${article.week} · ${article.publication}</div>
        </div>
      `).join('');
    }

    function showArticle(id) {
      const article = data.articles.find(a => a.id === id);
      if (!article) return;

      const list = document.getElementById('articles-list');
      const detail = document.getElementById('article-detail');
      list.classList.add('hidden');
      detail.classList.remove('hidden');

      detail.innerHTML = `
        <a href="#" class="back-link" onclick="renderList(); return false;">← Back to list</a>
        <header style="text-align:left; margin-bottom:24px;">
          <h1 style="font-size:1.4rem;">${article.title}</h1>
          <p>${article.week}<br>${article.publication}</p>
        </header>
        ${article.paragraphs.map(p => `
          <div class="para-card">
            <div class="para-number">${p.number}</div>
            <div class="para-question">${p.question}</div>
            <div class="para-comment">${p.comment}</div>
            <button class="copy-btn" onclick="copyText(\`${p.comment.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">Copy comment</button>
          </div>
        `).join('')}
      `;
    }

    init();
  </script>
</body>
</html>
